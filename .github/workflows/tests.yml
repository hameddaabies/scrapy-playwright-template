name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses PEP 604 (``X | None``) unions.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # No ``playwright install`` here on purpose. The suite drives spiders
        # through fixture HTML and asserts on request metadata, so it never
        # launches a browser — downloading Chromium would add ~100MB and a
        # minute per job for nothing. Add it if a test ever needs a real render.
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
