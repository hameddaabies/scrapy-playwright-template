name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Lint once, not per matrix entry: the rules in pyproject.toml are
      # version-independent, so a second interpreter would report the same set.
      - name: Install ruff
        # Just the linter, read from requirements.txt so the pin stays
        # single-sourced. Ruff never imports the project, so pulling in Scrapy
        # and Playwright here would be dead weight.
        run: pip install "$(grep '^ruff' requirements.txt)"

      - name: Lint
        run: python -m ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the codebase uses PEP 604 (``X | None``) unions.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # No ``playwright install`` here on purpose. The suite drives spiders
        # through fixture HTML and asserts on request metadata, so it never
        # launches a browser — downloading Chromium would add ~100MB and a
        # minute per job for nothing. Add it if a test ever needs a real render.
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
